<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Executive Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="calculator">
    <!-- Header Badge -->
    <div class="calc-header">
      <span class="brand-title">EXECUTIVE</span>
      <span class="status-indicator"></span>
    </div>

    <!-- Display Screen -->
    <div class="display">
      <div class="previous-operand"></div>
      <div class="current-operand">0</div>
    </div>

    <!-- Keypad Grid -->
    <div class="keypad">
      <button class="btn btn-function">C</button>
      <button class="btn btn-function">±</button>
      <button class="btn btn-function">%</button>
      <button class="btn btn-operator">÷</button>

      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn btn-operator">×</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn btn-operator">−</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn btn-operator">+</button>

      <button class="btn btn-zero">0</button>
      <button class="btn">.</button>
      <button class="btn btn-equals">=</button>
    </div>
  </div>

</body>
</html>
